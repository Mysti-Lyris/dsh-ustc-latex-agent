name: test

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Client smoke test
        run: node test/smoke-client.mjs
      - name: Transport self-test
        run: node probe.mjs --selftest
